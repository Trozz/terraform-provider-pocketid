name: Cleanup Pre-releases

on:
  # Run after a release finishes, never alongside it. Triggering on the tag
  # push made this race the Release workflow: cleanup deleted the dev tags
  # while GoReleaser was still resolving one of them as its changelog base,
  # which failed the v2.4.2 release with a 404 from the compare API.
  #
  # `workflow_run` matches on the workflow's `name:`, so this must stay in
  # step with `name: Release` in release.yml. If it drifts, cleanup silently
  # stops running on release and only the daily schedule trims pre-releases.
  #
  # This also replaces `release: published`, which does not fire at all here:
  # GoReleaser creates the release with the default GITHUB_TOKEN, and events
  # from that token do not trigger further workflows.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  schedule:
    # Run daily at 2 AM UTC (backstop: keep the latest few)
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      keep_count:
        description: "Number of pre-releases to keep"
        required: false
        default: "5"
        type: string
      dry_run:
        description: "Dry run - only show what would be deleted"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  cleanup:
    name: Cleanup Old Pre-releases
    runs-on: ubuntu-latest
    # Only clear the dev pre-releases once a release has actually succeeded.
    # After a failed release they are the only builds covering the commits
    # since the last stable tag, so they are kept; the daily schedule trims
    # them back to the usual few.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Cleanup pre-releases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = context.payload.inputs?.dry_run === 'true';

            // Determine how many pre-releases to keep. After a successful
            // release, remove all dev pre-releases it supersedes (release.yml
            // only runs for stable vX.Y.Z tags). The daily schedule keeps the
            // latest few as a backstop.
            let keepCount = parseInt(context.payload.inputs?.keep_count || '5');
            if (context.eventName === 'workflow_run') {
              keepCount = 0;
              // On workflow_run, context.ref is the default branch rather than
              // the released tag, so read the tag from the triggering run.
              const releasedTag = context.payload.workflow_run?.head_branch ?? '(unknown)';
              console.log(`Release ${releasedTag} succeeded; removing all dev pre-releases it supersedes.`);
            }

            console.log(`Configuration: Keep ${keepCount} pre-releases, Dry run: ${dryRun}`);

            // Get all releases
            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            // Filter pre-releases with dev versions
            const preReleases = releases.data
              .filter(release => release.prerelease && release.tag_name.includes('-dev.'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // Keep the specified number of latest pre-releases
            const toDelete = preReleases.slice(keepCount);

            console.log(`Found ${preReleases.length} pre-releases, will delete ${toDelete.length}`);

            if (toDelete.length === 0) {
              console.log('No pre-releases to delete');
              return;
            }

            // List releases to be deleted
            console.log('\nPre-releases to delete:');
            for (const release of toDelete) {
              console.log(`- ${release.tag_name} (created: ${release.created_at})`);
            }

            if (dryRun) {
              console.log('\nDry run mode - no deletions performed');
              return;
            }

            // Delete old pre-releases
            for (const release of toDelete) {
              console.log(`\nDeleting pre-release: ${release.tag_name}`);

              try {
                // Delete the release
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });
                console.log(`✓ Deleted release ${release.tag_name}`);

                // Delete the tag
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${release.tag_name}`
                  });
                  console.log(`✓ Deleted tag ${release.tag_name}`);
                } catch (error) {
                  console.log(`✗ Failed to delete tag ${release.tag_name}: ${error.message}`);
                }
              } catch (error) {
                console.log(`✗ Failed to delete release ${release.tag_name}: ${error.message}`);
              }
            }

            console.log('\nCleanup completed');
