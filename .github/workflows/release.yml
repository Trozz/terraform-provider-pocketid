name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Resolve previous stable tag
        id: previous_tag
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          # The changelog is built with `use: github`, so GoReleaser asks the
          # GitHub API for the preceding release rather than reading git tags.
          # That picks up the dev pre-releases, which the cleanup workflow
          # deletes on this same tag push, and the compare then 404s. The git
          # level `ignore_tags` setting does not apply to that lookup, so pin
          # the base to the last stable tag explicitly.
          previous=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -v -- '-dev' \
            | grep -vx "$CURRENT_TAG" \
            | head -n 1)
          echo "Previous stable tag: ${previous:-<none, first release>}"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          # Pin GoReleaser to the pushed tag so a dev pre-release tag on the
          # same commit can't win `git describe` and publish the wrong version.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Empty when there is no earlier stable tag, which GoReleaser treats
          # as unset and falls back to its own resolution.
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous_tag.outputs.tag }}

      - name: Generate release attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_checksums.txt
